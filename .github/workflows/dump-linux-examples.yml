name: dump-linux-examples
on:
  push:
    branches:
      - jz-dump-linux-examples
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:examples
      - uses: actions/upload-artifact@v4
        with:
          name: linux-examples
          path: examples/
